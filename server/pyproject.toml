[project]
name = "kitchen-display-server"
version = "0.1.0"
description = "Local backend for the Surface Pro kitchen display: fetches data, holds keys, serves the web app."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kitchen-display = "kitchen.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kitchen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
